name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "rust/**"
      - "android/**"
      - "pubspec.yaml"
      - ".github/workflows/build-debug.yml"

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0

      - name: Add Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Create secrets file from template
        run: |
          cp lib/constant/secrets.dart.template lib/constant/secrets.dart
          sed -i 's|const oauthRedirectUrl = ""|const oauthRedirectUrl = "gitsync://auth"|' lib/constant/secrets.dart
          # Fail early: an empty GitHub client id makes the sign-in page return 404.
          grep -E 'const gitHubClientId = "[^"]+"' lib/constant/secrets.dart
          test -f lib/api/manager/auth/github_device_flow.dart

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.2

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Install cargo-expand
        run: cargo install cargo-expand --version 1.0.121 --locked

      - name: Get Packages
        run: flutter pub get

      - name: Generate Rust
        run: |
          flutter_rust_bridge_codegen generate
          git checkout HEAD -- rust/src/frb_generated.rs

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29-beta4

      - uses: SimonMarquis/android-accept-licenses@v1

      - name: Use stable debug keystore (optional secret DEBUG_KEYSTORE_BASE64)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Using the stable debug keystore: new builds install over the previous one."
          else
            echo "No keystore secret: the signature changes every build, uninstall the old app first."
          fi

      - name: Build Debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: gitsync-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Build summary
        run: |
          echo "APK built from commit ${GITHUB_SHA::7}. After installing, GitHub sign-in must open a 'Connect to GitHub' dialog with a code; if the browser opens directly, an old build is installed." >> "$GITHUB_STEP_SUMMARY"
